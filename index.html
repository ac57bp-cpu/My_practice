<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <div class="main">
        <nav>
            <div class="logo_area">
                <div class="logo_img">
                    <img src="./images/logo.png" alt="">
                </div>
                <h2>Electric PC <br>Design</h2>
            </div>

            <ul class="nav__menu">
                <li><a href="#">Top</a></li>
                <li><a href="#">Detail</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <!-- infomation section -->
        <div class="infomation">
            <div class="overlay"></div>
            <img src="./images/pc.png" class="pc" alt="">
            <div id="circle">
                <div class="feature one">
                    <img src="/images/camera.png" alt="">
                    <div>
                        <h1>camera</h1>
                        <p>Beautiful lens .</p>
                    </div>
                </div>

                <div class="feature two">
                    <img src="/images/processor.png" alt="">
                    <div>
                        <h1>processor</h1>
                        <p>processor is important .</p>
                    </div>
                </div>

                <div class="feature three">
                    <img src="/images/battery.png" alt="">
                    <div>
                        <h1>battery</h1>
                        <p>battery is powerful.</p>
                    </div>
                </div>

                <div class="feature four">
                    <img src="/images/display.png" alt="">
                    <div>
                        <h1>display</h1>
                        <p>Beautiful display .</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- control section -->
        <div class="control">
            <img src="./images/arrow.png" id="upbtn">
            <h3>Feature</h3>
            <img src="./images/arrow.png" id="downbtn">
        </div>
    </div>
